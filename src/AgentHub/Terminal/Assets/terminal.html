<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="xterm.css" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #0A0F17;
      overflow: hidden;
    }
    #terminal-container {
      width: 100%;
      height: 100%;
      padding: 4px;
      box-sizing: border-box;
    }
    /* Give the xterm scrollbar an explicit width so the FitAddon reserves
       space for it and text is never rendered underneath the scrollbar. */
    .xterm-viewport::-webkit-scrollbar {
      width: 12px;
    }
    .xterm-viewport::-webkit-scrollbar-track {
      background: #0A0F17;
    }
    .xterm-viewport::-webkit-scrollbar-thumb {
      background: #24344B;
      border-radius: 6px;
      border: 2px solid #0A0F17;
    }
    .xterm-viewport::-webkit-scrollbar-thumb:hover {
      background: #35506F;
    }
  </style>
</head>
<body>
  <div id="terminal-container"></div>
  <script src="xterm.js"></script>
  <script src="xterm-addon-fit.js"></script>
  <script>
    const term = new Terminal({
      cursorBlink: true,
      cursorStyle: 'bar',
      fontSize: 13,
      fontFamily: 'Consolas, "Cascadia Code", "Courier New", monospace',
      theme: {
        background: '#0A0F17',
        foreground: '#E6F1FF',
        cursor: '#2FD4F5',
        cursorAccent: '#0A0F17',
        selectionBackground: '#1E3350',
        black: '#0A0F17',
        red: '#FF6B5A',
        green: '#34E5A8',
        yellow: '#F5C24B',
        blue: '#4C9DFF',
        magenta: '#B98BFF',
        cyan: '#2FD4F5',
        white: '#D3DEF0',
        brightBlack: '#5A6B85',
        brightRed: '#FF8A7A',
        brightGreen: '#5BF0BE',
        brightYellow: '#FFD873',
        brightBlue: '#7CBBFF',
        brightMagenta: '#CFAAFF',
        brightCyan: '#63E4FF',
        brightWhite: '#FFFFFF'
      }
    });

    const fitAddon = new FitAddon.FitAddon();
    term.loadAddon(fitAddon);
    term.open(document.getElementById('terminal-container'));

    // Write output while keeping the view pinned to the latest content.
    // We only auto-scroll when the user was already at the bottom, so
    // scrolling up to read earlier output is preserved.
    function writeToTerminal(data) {
      const buffer = term.buffer.active;
      const wasAtBottom = buffer.viewportY >= buffer.baseY;
      term.write(data, () => {
        if (wasAtBottom) term.scrollToBottom();
      });
    }

    function notifyResize() {
      try {
        const wasAtBottom = term.buffer.active.viewportY >= term.buffer.active.baseY;
        fitAddon.fit();
        if (wasAtBottom) term.scrollToBottom();
        if (window.chrome && window.chrome.webview) {
          window.chrome.webview.postMessage(JSON.stringify({
            type: 'resize',
            cols: term.cols,
            rows: term.rows
          }));
        }
      } catch (e) {}
    }

    // Coalesce multiple size changes into a single fit per frame.
    let resizeScheduled = false;
    function scheduleFit() {
      if (resizeScheduled) return;
      resizeScheduled = true;
      requestAnimationFrame(() => {
        resizeScheduled = false;
        notifyResize();
      });
    }

    window.addEventListener('resize', scheduleFit);

    // Refit whenever the container's actual size changes. This covers the case
    // where WebView2 finishes its layout after the initial timed fit, which
    // otherwise leaves the terminal too short and cuts off the bottom rows.
    const resizeObserver = new ResizeObserver(scheduleFit);
    resizeObserver.observe(document.getElementById('terminal-container'));

    term.onData(data => {
      if (window.chrome && window.chrome.webview) {
        window.chrome.webview.postMessage(JSON.stringify({
          type: 'input',
          data: data
        }));
      }
    });

    // Send text to the running session as if typed. Used by paste.
    function sendInput(data) {
      if (!data) return;
      if (window.chrome && window.chrome.webview) {
        window.chrome.webview.postMessage(JSON.stringify({ type: 'input', data: data }));
      }
    }

    function copySelection() {
      const text = term.getSelection();
      if (text && navigator.clipboard) {
        navigator.clipboard.writeText(text).catch(() => {});
      }
      return !!text;
    }

    function pasteClipboard() {
      if (navigator.clipboard && navigator.clipboard.readText) {
        navigator.clipboard.readText().then(sendInput).catch(() => {});
      }
    }

    // xterm renders to a canvas, so the browser's native copy/paste can't reach
    // the selection. Wire up the usual terminal shortcuts explicitly:
    //   Ctrl+Shift+C -> copy selection   Ctrl+Shift+V -> paste
    // Ctrl+Shift+* is used (not plain Ctrl+C/V) so Ctrl+C still sends SIGINT.
    term.attachCustomKeyEventHandler(e => {
      if (e.type !== 'keydown') return true;
      if (e.ctrlKey && e.shiftKey && (e.key === 'C' || e.key === 'c')) {
        copySelection();
        return false;
      }
      if (e.ctrlKey && e.shiftKey && (e.key === 'V' || e.key === 'v')) {
        pasteClipboard();
        return false;
      }
      return true;
    });

    // Minimal right-click context menu for copy/paste.
    const menu = document.createElement('div');
    menu.style.cssText = [
      'position:fixed', 'z-index:1000', 'display:none',
      'background:#111A28', 'border:1px solid #24344B', 'border-radius:6px',
      'padding:4px', 'box-shadow:0 4px 16px rgba(0,0,0,0.5)',
      'font-family:Consolas, "Segoe UI", sans-serif', 'font-size:13px',
      'color:#E6F1FF', 'user-select:none', 'min-width:120px'
    ].join(';');
    function makeItem(label, onClick) {
      const item = document.createElement('div');
      item.textContent = label;
      item.style.cssText = 'padding:6px 12px;border-radius:4px;cursor:pointer';
      item.addEventListener('mouseenter', () => { item.style.background = '#1E3350'; });
      item.addEventListener('mouseleave', () => { item.style.background = 'transparent'; });
      item.addEventListener('mousedown', ev => {
        ev.preventDefault();
        hideMenu();
        onClick();
      });
      return item;
    }
    const copyItem = makeItem('Copy', copySelection);
    const pasteItem = makeItem('Paste', pasteClipboard);
    menu.appendChild(copyItem);
    menu.appendChild(pasteItem);
    document.body.appendChild(menu);

    function hideMenu() { menu.style.display = 'none'; }

    document.getElementById('terminal-container').addEventListener('contextmenu', e => {
      e.preventDefault();
      const hasSelection = !!term.getSelection();
      copyItem.style.opacity = hasSelection ? '1' : '0.4';
      copyItem.style.pointerEvents = hasSelection ? 'auto' : 'none';
      menu.style.left = Math.min(e.clientX, window.innerWidth - 130) + 'px';
      menu.style.top = Math.min(e.clientY, window.innerHeight - 80) + 'px';
      menu.style.display = 'block';
    });
    window.addEventListener('mousedown', e => { if (!menu.contains(e.target)) hideMenu(); });
    window.addEventListener('scroll', hideMenu, true);
    window.addEventListener('blur', hideMenu);

    if (window.chrome && window.chrome.webview) {
      window.chrome.webview.addEventListener('message', event => {
        const msg = event.data;
        if (typeof msg === 'string') {
          if (msg.startsWith('{') && msg.includes('"type":"clear"')) {
            term.reset();
            return;
          }
          // Host asks for a fresh fit (e.g. just after a CLI launched) so the
          // process is told the real terminal size and its bottom status/mode
          // line isn't laid out below the visible area.
          if (msg.startsWith('{') && msg.includes('"type":"refit"')) {
            scheduleFit();
            return;
          }
          // Host just launched a session here; put the cursor in it so the user can type straight away.
          if (msg.startsWith('{') && msg.includes('"type":"focus"')) {
            term.focus();
            return;
          }
          writeToTerminal(msg);
        } else if (msg && msg.type === 'clear') {
          term.reset();
        } else if (msg && msg.type === 'write') {
          writeToTerminal(msg.data);
        }
      });

      // Initial fit and notify host
      setTimeout(() => {
        notifyResize();
        window.chrome.webview.postMessage(JSON.stringify({
          type: 'ready',
          cols: term.cols,
          rows: term.rows
        }));
      }, 50);
    }
  </script>
</body>
</html>
